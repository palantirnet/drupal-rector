name: '🧪 Functional (single rectors)'

# This test will run on every pull request, and on every commit on any branch
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Run tests every week (to check for rector changes)
    - cron: '0 0 * * 0'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_functional_test_single:
    name: '🧪 Functional Test | single rectors'
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: '🐘 Setup PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2
          extensions: dom, curl, libxml, mbstring, zip, pdo, mysql, pdo_mysql, gd

      - name: '🗃 Get composer cache directory'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: '💽 Cache composer dependencies'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: '💧 Setup Drupal'
        run: |
          composer create-project 'drupal/recommended-project:^11.0' ~/drupal --no-interaction --no-progress --ansi
          cd ~/drupal
          composer config repositories.drupal-rector path "$GITHUB_WORKSPACE"

      - name: '🏠 Install Drupal Rector'
        run: |
          cd ~/drupal
          composer require palantirnet/drupal-rector:@dev --no-interaction --no-progress --ansi

      - name: '📁 Prepare rector_examples folder in the drupal modules directory'
        run: |
          cd ~/drupal
          mkdir -p web/modules/custom
          cp -R "${GITHUB_WORKSPACE}/tests/functional/hookconvertrector/fixture/hookconvertrector" web/modules/custom/hookconvertrector

      # dry-run is expected to return exit code 2 if there are changes, which we are expecting to happen, here.
      # an error code of 1 represents other errors.
      # @see \Rector\Core\Console\ExitCode::CHANGED_CODE
      - name: '👀 Run rector against Drupal (dry-run)'
        run: |
          cd ~/drupal
          for d in web/modules/custom/*; do
            if [ -d "$d" ]; then
              echo "Processing $d"
              cp "${GITHUB_WORKSPACE}/tests/functional/$(basename "${d}")/rector.php" .
              vendor/bin/rector process "$d" --dry-run --debug --no-progress-bar || if (($? == 2)); then true; else exit 1; fi
            fi
          done

      - name: '🏠 Run rector against Drupal'
        run: |
          cd ~/drupal
          for d in web/modules/custom/*; do
            if [ -d "$d" ]; then
              echo "Processing $d"
              cp "${GITHUB_WORKSPACE}/tests/functional/$(basename "${d}")/rector.php" .
              vendor/bin/rector process "$d" --debug --no-progress-bar
            fi
          done

      # diff options:
      # -r: recursive
      # -u: show the joined context, like git diff
      # -b: ignore whitespace
      # -B: ignore lines that are only whitespace
      # --color: colorize the output
      - name: '✅ Check that the updated examples match expectations'
        run: |
          cd ~/drupal
          for d in web/modules/custom/*; do
            if [ -d "$d" ]; then
              diff --color -rubB "$d" "${GITHUB_WORKSPACE}/tests/functional/$(basename "${d}")/fixture/$(basename "${d}")_updated"
            fi
          done
